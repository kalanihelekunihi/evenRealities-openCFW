# A single, signature-validated application slot leaves the recovered R1
# settings and 0x24000-byte product-data region intact.  The boot partition
# retains a source-built BLE loader, so an interrupted direct upload cannot
# remove the recovery path.
CONFIG_SINGLE_APPLICATION_SLOT=y
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_MCUBOOT_SERIAL=n
CONFIG_MCUBOOT_ACTION_HOOKS=y

CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CTLR=y
CONFIG_BT_DEVICE_NAME="OPENR1-RECOVERY"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SETTINGS=n
CONFIG_BT_SMP=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_REBOOT=y
