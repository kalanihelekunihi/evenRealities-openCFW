# Source-built Bluetooth host/controller and R1 BAE8 transport.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_DEVICE_NAME="EVEN R1_000000"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=18
CONFIG_BT_DEVICE_APPEARANCE=576
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Preserve the recovered 244-byte attribute payload limit (247-byte ATT MTU).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_ATT_TX_COUNT=4

# R1 stock firmware calibrated the low-frequency RC oscillator rather than
# assuming a fitted 32.768 kHz crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# HBA owns 31 initializer allocations plus six recurrent-state allocations;
# HRV has a separate persistent context. Both are constructed together when
# the Goodix profile starts, so reserve their source-owned runtime heap.
CONFIG_HEAP_MEM_POOL_SIZE=24576

# Direct source-built nRF NVMC access to the recovered 36-page product-data
# region. The flash-map adapter binds kv.bin and sleep.db directly.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=3

# Exact recovered SAADC routes. Battery reads remain fail-closed until the
# shared battery-power lease is bound by a typed power adapter.
CONFIG_ADC=y
CONFIG_COUNTER=y

# Recovered touch and motion buses. Touch uses TWIM0 at 400 kHz on P0.12/P0.01
# with a deferred falling-edge RDY input on P0.17; motion uses TWIM1 at
# 400 kHz on P0.11/P0.14 with a deferred rising-edge input on P0.15.
CONFIG_I2C=y
CONFIG_EVENTS=y

# Recovered scheduler-liveness watchdog cadence: 10-second reset, one feed
# channel every 1,024 ticks, running in sleep and paused by a debugger.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1024
CONFIG_WATCHDOG=y

# No development-board UART, RTT, shell, or log backend is part of the ring
# image. Faults remain visible to a debugger through the Zephyr fault frame.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
